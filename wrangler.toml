# Cloudflare configuration for the multi-tenant homepage SaaS platform.
# 1. Replace <YOUR_ACCOUNT_ID> with your Cloudflare account ID.
# 2. Replace <YOUR_DATABASE_ID> with the D1 database ID created by `wrangler d1 create`.
# 3. Replace <YOUR_R2_BUCKET_NAME> with your R2 bucket name.
# 4. Run `wrangler d1 migrations apply DB` to create tables.
# 5. Run `npm install` then `npx @cloudflare/next-on-pages` to build for Pages.

name = "kimgyunghoon-studio"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Pages deployment (default)
# ---------------------------------------------------------------------------
# `@cloudflare/next-on-pages` builds the app into `.vercel/output/static` plus
# a `_worker.js` edge function. Deploying to Pages works for the exact custom
# domain (lucidworker.com) but Pages does NOT support wildcard subdomains.
pages_build_output_dir = ".vercel/output/static"

# ---------------------------------------------------------------------------
# Worker deployment (for wildcard subdomains)
# ---------------------------------------------------------------------------
# Cloudflare Pages cannot route `*.lucidworker.com` wildcard subdomains. To
# serve tenant subdomains (e.g. <siteId>.lucidworker.com) we deploy the same
# `_worker.js` produced by next-on-pages as a Worker and attach a wildcard
# route. `wrangler deploy` uses `main` + `routes`; `wrangler pages deploy`
# uses `pages_build_output_dir`. Keep both so either deployment path works.
main = ".vercel/output/static/_worker.js"

# Route ALL traffic for the apex domain AND every subdomain to this Worker.
# `*.lucidworker.com/*` matches lucidworker.com and all subdomains on every
# path. The zone must be active in the same Cloudflare account.
routes = [
  { pattern = "lucidworker.com/*", zone_name = "lucidworker.com" },
  { pattern = "*.lucidworker.com/*", zone_name = "lucidworker.com" },
]


# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "homepagebuilder"
database_id = "7b30413f-4e8d-4be9-9eb1-94e7bfd7ec6d"

# R2 bucket binding for user uploaded media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "homepagebuilder-images"

# Plain environment variables (non-secrets).
# NOTE: Do NOT put OAuth secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# SESSION_SECRET, etc.) here. They are managed as encrypted Secrets/Variables
# in the Cloudflare Pages dashboard to avoid binding-name conflicts and to
# keep secrets out of the repository.
[vars]
NODE_ENV = "production"
PLATFORM_HOST = "lucidworker.com"
NEXTAUTH_URL = "https://lucidworker.com"
GOOGLE_REDIRECT_URI = "https://lucidworker.com/api/auth/callback/google"

R2_PUBLIC_URL = "https://pub-b1642f7b304b430b9818d0f1370a6a73.r2.dev"



# Secrets (set in the Cloudflare Pages dashboard -> Settings -> Environment
# variables, or with `wrangler pages secret put <NAME> --project-name kimgyunghoon-studio`):
# - SESSION_SECRET
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - GEMINI_API_KEY (optional)
# - GITHUB_TOKEN (optional)
# - CLOUDFLARE_API_TOKEN (optional)


